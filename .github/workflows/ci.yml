name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Deliberately a single un-matrixed job so the status check is named exactly
  # `build` — that is the context main's branch protection requires.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Tests
        run: vendor/bin/phpunit
